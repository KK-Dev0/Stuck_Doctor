name: Keep the AI awake

# Render's free plan puts the back end to sleep after about 15 minutes with no visitors.
# This pings it every 10 minutes so the first person to open the site doesn't wait.
# GitHub runs scheduled jobs on a best-effort basis, so a ping can occasionally be a few minutes late.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping the Render back end
        run: curl -fsS --max-time 90 --retry 3 --retry-delay 15 -o /dev/null https://stuck-doctor.onrender.com/
